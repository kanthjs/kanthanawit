project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "cv/index.qmd"
    - "writing/**/*.qmd"
    - "projects/**/*.qmd"
    - "apps/**/*.qmd"
    - "r-packages/**/*.qmd"
    - "talks/**/*.qmd"
  resources:
    - "images/**"
    - "robots.txt"

execute:
  freeze: auto

website:
  title: "Kanthanawit"
  site-url: "https://kanthanawit.in.th"
  description: "Kanthanawit's playground — rice research, R packages, agricultural statistics, and other small things built along the way"
  favicon: images/favicon.svg
  open-graph: true

  navbar:
    right:
      - text: "About"
        href: cv/index.qmd
      - text: "Blog"
        href: writing/index.qmd
      - text: "Project"
        href: projects/index.qmd
      - text: "Talks"
        href: talks/index.qmd
      - icon: github
        aria-label: "GitHub"
        href: https://github.com/kanthjs
      - icon: rss
        aria-label: "RSS"
        href: writing/index.xml

  page-footer:
    center: "© 2026 Kanth's Playbook"

format:
  html:
    theme:
      - styles.scss
    include-in-header: header.html
    toc: true
    toc-title: "Topic"
    grid:
      body-width: 840px
    html-math-method: plain
    lang: th
