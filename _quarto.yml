project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "about/index.qmd"
    - "talks/index.qmd"
    - "r-packages/**/*.qmd"
    - "blog/**/*.qmd"
    - "talks/**/*.qmd"
  resources:
    - "images/**"
    - "robots.txt"

execute:
  freeze: auto

website:
  title: "Kanthanawit"
  site-url: "https://kanthanawit.in.th"
  description: "Kanthanawit's playground — rice research, R packages, agricultural statistics, and other small things built along the way"
  favicon: images/favicon.svg
  open-graph: true

  navbar:
    logo: images/kjs.svg
    tools:
      - icon: github
        aria-label: "GitHub"
        href: https://github.com/kanthjs
    right:
      - text: "About"
        href: about/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Software"
        href: r-packages/index.qmd

  page-footer:
    left: "© 2026 Kanthanawit ∙ Made with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    include-in-header: header.html
    toc: true
    toc-title: "Topic"
    grid:
      body-width: 860px
    html-math-method: plain
    lang: th
