project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "404.qmd"
    - "about/index.qmd"
    - "talks/index.qmd"
    - "r-packages/**/*.qmd"
    - "books/**/*.qmd"
    - "blog/**/*.qmd"
    - "talks/**/*.qmd"
  resources:
    - "images/**"
    - "fonts/**"
    - "robots.txt"
    - "CNAME"

execute:
  freeze: true

website:
  title: "Kanthanawit"
  site-url: "https://kanthanawit.in.th"
  description: "Kanthanawit's playground — rice research, R packages, agricultural statistics, and other small things built along the way"
  favicon: images/favicon.svg
  open-graph:
    image: "https://kanthanawit.in.th/images/og-default.jpg"
  twitter-card:
    image: "https://kanthanawit.in.th/images/og-default.jpg"

  navbar:
    logo: images/kjs.svg
    tools:
      - icon: github
        aria-label: "GitHub"
        href: https://github.com/kanthjs
      - icon: rss
        aria-label: "RSS feed"
        href: blog/index.xml
    right:
      - text: "About"
        href: about/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Books"
        href: books/index.qmd
      - text: "Software"
        href: r-packages/index.qmd
      - text: "Talks"
        href: talks/index.qmd

  page-footer:
    center: "© 2026 Kanthanawit ∙ Made with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [cosmo, styles.scss, styles-dark.scss]
    mainfont: "IBM Plex Sans Thai Looped"
    monofont: "Fira Code"
    include-in-header: header.html
    toc: true
    toc-title: "สารบัญ"
    grid:
      body-width: 860px
    html-math-method: mathjax
    lang: th

knitr:
  opts_chunk:
    fig.showtext: true
    dpi: 300
